name: Verify FocusDeck
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './desktop[test]'
      - run: ./scripts/test-desktop.sh
      - run: python scripts/test-battery-profile.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./android/gradlew testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: focusdeck-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
